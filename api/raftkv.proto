syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/ritvik-devireddy/raftkv/api/raftkvpb;raftkvpb";

// KV is the client-facing API. Every request carries a (client_id, seq) pair
// so a retried request is applied at most once (see internal/kv).
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CompareAndSwap(CASRequest) returns (CASResponse);
}

// Raft is the node-to-node API. The Raft core is message-passing: a vote
// request and its reply are two independent messages, not a call and its
// return value, and either may be lost or arrive late. So the wire protocol is
// one fire-and-forget RPC that carries any of the six message kinds, and the
// receiver feeds it straight into the node.
service Raft {
  rpc Step(RaftMessage) returns (StepAck);
  // TODO(snapshots): InstallSnapshot payload
}

// ---- client API ----

// Shared by every client response: set when the node that received the request
// is not the leader, so the client can retry against leader_hint.
message RedirectInfo {
  bool not_leader = 1;
  string leader_hint = 2; // address of the believed leader, may be empty
}

message GetRequest {
  string key = 1;
  string client_id = 2;
  uint64 seq = 3;
}
message GetResponse {
  RedirectInfo redirect = 1;
  bool found = 2;
  string value = 3;
}

message PutRequest {
  string key = 1;
  string value = 2;
  string client_id = 3;
  uint64 seq = 4;
}
message PutResponse {
  RedirectInfo redirect = 1;
}

message DeleteRequest {
  string key = 1;
  string client_id = 2;
  uint64 seq = 3;
}
message DeleteResponse {
  RedirectInfo redirect = 1;
  bool existed = 2;
}

message CASRequest {
  string key = 1;
  string expected = 2; // a missing key compares equal to ""
  string value = 3;
  string client_id = 4;
  uint64 seq = 5;
}
message CASResponse {
  RedirectInfo redirect = 1;
  bool swapped = 2;
  string current = 3; // value after the operation
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

// ---- Raft messages (field names follow Figure 2 of the Raft paper) ----

message RaftMessage {
  int32 from = 1;
  int32 to = 2;
  oneof payload {
    RequestVoteRequest request_vote = 3;
    RequestVoteResponse request_vote_reply = 4;
    AppendEntriesRequest append_entries = 5;
    AppendEntriesResponse append_entries_reply = 6;
    PreVoteRequest pre_vote = 7;
    PreVoteResponse pre_vote_reply = 8;
  }
}

// Receipt only. Raft replies travel as their own RaftMessage.
message StepAck {}

message RequestVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// PreVote asks "would you vote for me?" without anyone changing term or vote.
// term is the term the candidate WOULD use (its current term plus one).
message PreVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message PreVoteResponse {
  uint64 term = 1;          // replier's current term
  uint64 pre_vote_term = 2; // the term that was asked about, echoed back
  bool vote_granted = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;    // last entry the follower verified matches the leader
  uint64 last_log_index = 4; // follower's log length, so the leader can skip back fast
}
