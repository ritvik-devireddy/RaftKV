syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/ritvik-devireddy/raftkv/api/raftkvpb;raftkvpb";

// KV is the client-facing API. Every request carries a (client_id, seq) pair
// so a retried request is applied at most once (see internal/kv).
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CompareAndSwap(CASRequest) returns (CASResponse);
}

// Raft is the node-to-node API. Field names follow Figure 2 of the Raft paper.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  // TODO(snapshots): rpc InstallSnapshot(...)
}

// ---- client API ----

// Shared by every client response: set when the node that received the request
// is not the leader, so the client can retry against leader_hint.
message RedirectInfo {
  bool not_leader = 1;
  string leader_hint = 2; // address of the believed leader, may be empty
}

message GetRequest {
  string key = 1;
  string client_id = 2;
  uint64 seq = 3;
}
message GetResponse {
  RedirectInfo redirect = 1;
  bool found = 2;
  string value = 3;
}

message PutRequest {
  string key = 1;
  string value = 2;
  string client_id = 3;
  uint64 seq = 4;
}
message PutResponse {
  RedirectInfo redirect = 1;
}

message DeleteRequest {
  string key = 1;
  string client_id = 2;
  uint64 seq = 3;
}
message DeleteResponse {
  RedirectInfo redirect = 1;
  bool existed = 2;
}

message CASRequest {
  string key = 1;
  string expected = 2; // a missing key compares equal to ""
  string value = 3;
  string client_id = 4;
  uint64 seq = 5;
}
message CASResponse {
  RedirectInfo redirect = 1;
  bool swapped = 2;
  string current = 3; // value after the operation
}

// ---- Raft RPCs ----

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
}
